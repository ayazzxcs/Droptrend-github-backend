name: Fetch CJ Products

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run script
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: node scripts/fetch-cj-products.js

      - name: Commit products
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add products.json products-meta.json
          git commit -m "Update products" || echo "No changes"
          git push
